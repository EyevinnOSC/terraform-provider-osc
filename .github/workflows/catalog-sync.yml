name: Sync catalog mirror

# Regenerates catalog/services.json and the per-service guide pages from the OSC
# catalog API and opens a pull request with the diff. No provider code is generated:
# the provider reads the mirror at plan time for services a workspace has not
# subscribed to, and the registry shows the guide pages once a release is tagged.

on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 06:00 UTC.
    - cron: '0 6 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync catalog mirror and guides
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: 'go.mod'
          cache: true

      # tfplugindocs (invoked by `make generate`) shells out to terraform.
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      - name: Sync catalog
        env:
          OSC_API_KEY: ${{ secrets.OSC_API_KEY }}
        run: make catalog

      - name: Regenerate docs
        run: make generate

      - name: Verify
        run: make build test

      - name: Create pull request
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          token: ${{ secrets.PR_TOKEN }}
          branch: automated/catalog-sync
          delete-branch: true
          commit-message: 'chore: sync catalog mirror and service guides'
          title: 'chore: sync catalog mirror and service guides'
          labels: automated
          body: |
            Automated sync of `catalog/services.json` and the per-service guide pages
            from the OSC catalog API.

            No provider code changes. Merging is safe; tag a release afterwards so the
            Terraform Registry shows the updated guides. Until then the provider already
            reads the merged mirror from the `main` branch at plan time.
